spring.application.name=Bookworm Delta

# ---------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------
# ddl-auto=validate on purpose: database/01_schema.sql owns the schema,
# and Hibernate's job is to prove the entities still match it. If the two
# drift apart the application refuses to start instead of quietly
# creating a column nobody wrote down.
#
# Username/password default to the dedicated bookworm_app MySQL user
# created by database/00_create_user.sql, NOT the machine's root
# password - everyone's MySQL root password is different (it is set
# during their own install), so pointing this at root would mean every
# teammate has to edit this file before the app will even start. The
# ${VAR:default} form still lets anyone override it with an environment
# variable (DB_USERNAME / DB_PASSWORD) without editing this file.
spring.datasource.url=jdbc:mysql://localhost:3306/bookworm_delta
spring.datasource.username=${DB_USERNAME:bookworm_app}
spring.datasource.password=${DB_PASSWORD:Bookworm@2026}
spring.jpa.hibernate.ddl-auto=validate

# ---------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------
# Override in production: BOOKWORM_JWT_SECRET must be at least 32 bytes.
bookworm.jwt.secret=${BOOKWORM_JWT_SECRET:MY_SUPER_SECRET_KEY_MY_SUPER_SECRET_KEY}
bookworm.jwt.expiry-ms=86400000

# Origins allowed to call this API. Vite picks the next free port when
# 5173 is taken, so the usual fallbacks are listed too - otherwise every
# request comes back as "Invalid CORS request" with no obvious cause.
bookworm.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# ---------------------------------------------------------------------
# Google sign-in
# ---------------------------------------------------------------------
# Only the client id is needed - see AuthService.loginWithGoogle. Unlike
# the datasource/mail credentials above, this is not a secret: it is
# handed to the browser on every page load anyway (Google Identity
# Services needs it client-side to render the Sign-In button), and the
# client SECRET from Google Cloud Console is never used at all, because
# this app verifies the ID token Google already signed rather than
# doing its own server-to-server exchange with Google.
google.oauth.client-id=${GOOGLE_CLIENT_ID:1009645585465-oeudoqq37fj238cgt66q9n524mmrn389.apps.googleusercontent.com}

# ---------------------------------------------------------------------
# Invoice email
# ---------------------------------------------------------------------
# Leave spring.mail.username blank to skip sending. EmailService checks
# it and returns early, so checkout does not stall on an SMTP timeout.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=brohitpandav123@gmail.com
spring.mail.password=cpwq ohnr ctuw ucaz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------
# Uploads
# ---------------------------------------------------------------------
# max-file-size is the limit for ONE file (the xlsx, or one cover jpg).
# max-request-size is the limit for the WHOLE request added together -
# raised well past max-file-size because a bulk upload now attaches a
# whole folder of cover images in a single request, on top of the xlsx.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=300MB

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Bookworm Delta
info.app.description=Online book store where a user can buy, rent, or borrow a book
info.app.version=1.0.0

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.example=DEBUG
