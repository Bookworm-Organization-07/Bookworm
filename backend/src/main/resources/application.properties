spring.application.name=Bookworm Delta

# ---------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/bookworm_delta
spring.datasource.username=${DB_USERNAME:bookworm_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate

# ---------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------
bookworm.jwt.secret=${BOOKWORM_JWT_SECRET:CHANGE_ME_IN_LOCAL_ENV}
bookworm.jwt.expiry-ms=86400000

# ---------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------
bookworm.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# ---------------------------------------------------------------------
# Google sign-in
# ---------------------------------------------------------------------
google.oauth.client-id=${GOOGLE_CLIENT_ID:1009645585465-oeudoqq37fj238cgt66q9n524mmrn389.apps.googleusercontent.com}

# ---------------------------------------------------------------------
# Invoice email
# ---------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------
# Uploads
# ---------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=300MB

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Bookworm Delta
info.app.description=Online book store where a user can buy, rent, or borrow a book
info.app.version=1.0.0

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.example=DEBUG
