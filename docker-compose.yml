# Dockerized .NET stack: mysql + BookwormApi + BookwormNotificationService +
# frontend (nginx, proxying /api to BookwormApi). Targets the .NET backend
# specifically - the Java counterpart in backend/ has its own Dockerfile
# already but isn't wired into this file.
#
# Host ports are deliberately different from the ones used for local
# `dotnet run` / `npm run dev` (8081/8091/8082 instead of 8080/8090/5173)
# so this stack can run side by side with a local dev setup without a port
# clash. Point a browser at http://localhost:8082 once it's up.
#
# Run:   docker compose up --build
# Stop:  docker compose down            (add -v to also wipe the DB volume)

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: bookworm_root_pw
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs once, in filename order, only on a brand-new (empty) volume -
      # same schema+seed files the bare-metal SETUP.md instructions use,
      # plus two Docker-only helpers (see each file for why it can't just
      # be the bare-metal files unchanged):
      #   00 - creates bookworm_app@'%' instead of @'localhost'
      #   01 - loads the three files itself, with
      #        --default-character-set=binary. database/04_product_covers.sql
      #        is deliberately NOT loaded here - it's corrupted on disk
      #        (pre-existing, unrelated to Docker) - see 01-load-database.sh
      #        for how that was confirmed and what it means for cover
      #        images (20 of 67 books have one instead of 52, until that
      #        file is regenerated from real source images).
      # The three files are mounted at /sql-source/, not directly under
      # initdb.d, so MySQL's own scanner doesn't also run them a second
      # time on top of 01's load.
      - ./docker/mysql-init/00-create-docker-user.sql:/docker-entrypoint-initdb.d/00-create-docker-user.sql:ro
      - ./docker/mysql-init/01-load-database.sh:/docker-entrypoint-initdb.d/01-load-database.sh:ro
      - ./database/01_schema.sql:/sql-source/01_schema.sql:ro
      - ./database/02_seed.sql:/sql-source/02_seed.sql:ro
      - ./database/03_seed_bulk_catalog.sql:/sql-source/03_seed_bulk_catalog.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pbookworm_root_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

  bookworm-notification:
    build: ./dotnet-backend/BookwormNotificationService
    restart: unless-stopped
    environment:
      # Invoice emails stay off by default here too, same as bare-metal -
      # set these two via a root-level .env file (MAIL_USERNAME/MAIL_PASSWORD,
      # gitignored) for real email. Compose substitutes them automatically;
      # blank if the .env file/vars aren't present.
      Mail__Username: ${MAIL_USERNAME:-}
      Mail__Password: ${MAIL_PASSWORD:-}
    ports:
      - "8091:8090"

  bookworm-api:
    build: ./dotnet-backend/BookwormApi
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      bookworm-notification:
        condition: service_started
    environment:
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=bookworm_delta;User=bookworm_app;Password=Bookworm@2026;TreatTinyAsBoolean=true"
      NotificationService__BaseUrl: "http://bookworm-notification:8090"
      # Same defaults appsettings.json ships with - override these for a
      # real deployment rather than editing the file, same reasoning as
      # the Mail__* vars in SETUP.md.
      Jwt__Secret: "MY_SUPER_SECRET_KEY_MY_SUPER_SECRET_KEY"
      Cors__AllowedOrigins__0: "http://localhost:8082"
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dotnet
    restart: unless-stopped
    depends_on:
      - bookworm-api
    ports:
      - "8082:80"

volumes:
  mysql_data:
