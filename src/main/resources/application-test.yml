# Test profile - separate schema so tests never touch dev data.
# Same docker-compose MySQL instance as dev (port 3307), different database name.
spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:bookworm_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: ${DB_USERNAME:bookworm}
    password: ${DB_PASSWORD:bookworm_dev}
  jpa:
    show-sql: false

logging:
  level:
    com.bookworm: INFO
