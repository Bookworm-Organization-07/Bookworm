# Local development profile.
# Defaults match docker-compose.yml (`docker compose up -d`) exactly, so a fresh
# checkout runs with zero env vars set. Point at your own MySQL instead by
# exporting DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD/DB_NAME before running.
spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:bookworm}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: ${DB_USERNAME:bookworm}
    password: ${DB_PASSWORD:bookworm_dev}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bookworm: DEBUG
