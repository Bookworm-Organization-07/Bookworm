spring:
  application:
    name: bookworm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate # Flyway (not Hibernate) owns the schema.
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  servlet:
    context-path: /api

bookworm:
  jwt:
    # MUST be overridden via env var in any shared/prod environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-deploying-anywhere-real}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Local disk storage for product cover images / book files / previews, served under /files/**.
  uploads-dir: ${UPLOADS_DIR:uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: Bookworm.com
    description: Virtual bookshop REST API — buy, rent, and borrow eBooks, audio, music, and video
